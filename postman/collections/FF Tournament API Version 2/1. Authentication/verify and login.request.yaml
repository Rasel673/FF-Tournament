$kind: http-request
url: "{{baseUrl}}/api/verify-otp"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "phone": "01567942853",
        "otp": "416439",
        "purpose": "login"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('token', jsonData.token);
      }
    language: text/javascript
settings: {}
order: 4000
