$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "phone": "01700000000",
      "password": "password"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        pm.collectionVariables.set('token', pm.response.json().token);
      }
    language: text/javascript
settings: {}
order: 2000
